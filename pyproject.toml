[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-tea-lab"
version = "0.0.1"
description = "Meta-analysis for CPA-focused A/B testing in Python"
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
license = "Apache-2.0"
dependencies = [
    "pandas>=3.0.5,<4",
    "statsmodels>=0.14.6,<0.15",
    "scipy>=1.18.0,<2",
    "numpy>=2.4.6,<3",
    "seaborn>=0.13.2,<0.14",
    "matplotlib>=3.11.1,<4",
    "plotly>=6.9.0,<7",
    "pymc>=6.2.0,<7",
    "numba>=0.65.1,<0.66",
    "nutpie>=0.16.11,<0.17",
    "arviz>=1.2.0,<2",
]

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff == 0.4.4"]

[project.urls]
Homepage = "https://github.com/outbrain-inc/ab-tea-lab"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
ignore = ["ANN101"]
fixable = ["ALL"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pandas.errors.Pandas4Warning",
    "ignore:divide by zero:RuntimeWarning:statsmodels",
    "ignore::FutureWarning:arviz",
]

